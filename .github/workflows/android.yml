name: android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Release signing uses the committed key unless these secrets are set (see app/build.gradle.kts).
      OCTO_KEYSTORE_B64: ${{ secrets.OCTO_KEYSTORE_BASE64 }}
      OCTO_KEYSTORE_PASSWORD: ${{ secrets.OCTO_KEYSTORE_PASSWORD }}
      OCTO_KEY_ALIAS: ${{ secrets.OCTO_KEY_ALIAS }}
      OCTO_KEY_PASSWORD: ${{ secrets.OCTO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.OCTO_KEYSTORE_B64 != ''
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$OCTO_KEYSTORE_B64" | base64 -d > "$keystore"
          echo "OCTO_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build debug and release APKs
        run: |
          args=(assembleDebug assembleRelease "-PversionCode=${GITHUB_RUN_NUMBER}")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=("-PversionName=${GITHUB_REF_NAME#v}")
          fi
          ./gradlew --stacktrace "${args[@]}"

      - name: Rename APKs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            # the default branch publishes the version in app/build.gradle.kts, other branches get a dev build number
            version="dev-${GITHUB_RUN_NUMBER}"
            if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              version=$(grep -oP '\?: "\K[0-9][^"]*' app/build.gradle.kts | head -1)
            fi
          fi
          mkdir -p apk
          # app-arm64-v8a-release.apk -> potato-files-<version>-arm64-v8a-release.apk
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            name="$(basename "$f" .apk)"
            cp "$f" "apk/potato-files-${version}-${name#app-}.apk"
          done
          ls -l apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: potato-files-apks
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    # a v* tag publishes that version. A push to the default branch publishes the version in
    # app/build.gradle.kts, so releases don't depend on pushing a tag by hand.
    if: github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # checkout first: it clears the workspace, which would delete the downloaded apks
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: potato-files-apks
          path: apk

      - name: Pick the release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(grep -oP '\?: "\K[0-9][^"]*' app/build.gradle.kts | head -1)
            tag="v${version}"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Publishing $tag"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apks=(apk/potato-files-*-release.apk)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # re-running for an existing tag replaces the apks: drop the old ones first, so a stale build can't be offered
            for name in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' | grep -- '-release.apk$' || true); do
              gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
            done
            gh release upload "$TAG" "${apks[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${apks[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Potato Files ${TAG}" \
              --generate-notes \
              "${flags[@]}"
          fi
