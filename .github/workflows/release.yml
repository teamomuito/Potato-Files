name: Build and release

# Pushing a tag like v0.1.0 builds the apk and publishes it as a GitHub release.
# Running it by hand builds the apk and keeps it as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Optional signing. Set these repo secrets to sign with your own key:
      #   OCTO_KEYSTORE_B64    base64 of the .jks file (base64 -w0 release.jks)
      #   OCTO_KEYSTORE_PASSWORD, OCTO_KEY_ALIAS, OCTO_KEY_PASSWORD
      # Without them the build falls back to the debug key, as app/build.gradle.kts says.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.OCTO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "OCTO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "No release keystore secret set, signing with the debug key."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release apk
        env:
          OCTO_KEYSTORE_PASSWORD: ${{ secrets.OCTO_KEYSTORE_PASSWORD }}
          OCTO_KEY_ALIAS: ${{ secrets.OCTO_KEY_ALIAS }}
          OCTO_KEY_PASSWORD: ${{ secrets.OCTO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name the apk
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/potato-files-${VERSION}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: potato-files-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: potato-files-apk
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK=$(ls dist/*.apk)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Potato Files $TAG" \
              --generate-notes
          fi
