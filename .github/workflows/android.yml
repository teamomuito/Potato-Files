name: android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Release signing comes from repo secrets. Without them, non-tag builds
      # fall back to the debug key (see app/build.gradle.kts).
      OCTO_KEYSTORE_B64: ${{ secrets.OCTO_KEYSTORE_BASE64 }}
      OCTO_KEYSTORE_PASSWORD: ${{ secrets.OCTO_KEYSTORE_PASSWORD }}
      OCTO_KEY_ALIAS: ${{ secrets.OCTO_KEY_ALIAS }}
      OCTO_KEY_PASSWORD: ${{ secrets.OCTO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Note signing key
        if: github.ref_type == 'tag' && env.OCTO_KEYSTORE_B64 == ''
        run: echo "::warning::No release keystore secret set. This release is signed with the debug key."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.OCTO_KEYSTORE_B64 != ''
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$OCTO_KEYSTORE_B64" | base64 -d > "$keystore"
          echo "OCTO_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Debug key fingerprint
        run: |
          ls -la ~/.android/ 2>/dev/null || echo "no ~/.android yet"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep "SHA256" || echo "no debug keystore before build"

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build debug and release APKs
        run: |
          args=(assembleDebug assembleRelease "-PversionCode=${GITHUB_RUN_NUMBER}")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=("-PversionName=${GITHUB_REF_NAME#v}")
          fi
          ./gradlew --stacktrace "${args[@]}"

      - name: Rename APKs
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="dev-${GITHUB_RUN_NUMBER}"
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk "apk/potato-files-${version}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "apk/potato-files-${version}-release.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: potato-files-apks
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: potato-files-apks
          path: apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk=$(ls apk/potato-files-*-release.apk)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # re-running the workflow for an existing tag replaces the apk
            gh release upload "$TAG" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Potato Files ${TAG}" \
              --generate-notes \
              "${flags[@]}"
          fi
